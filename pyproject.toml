[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "work-tracker"
version = "0.1.0"
description = "Work Tracker: desktop GUI and the samta-tracker command line, one application."
requires-python = ">=3.12"
dependencies = [
    "PySide6==6.10.2",
    "requests==2.32.5",
    "keyring==25.6.0",
    "typer==0.28.0",
]

[project.scripts]
samta-tracker = "src.cli.app:main"
work-tracker-gui = "gui_main:main"

[tool.setuptools]
py-modules = ["gui_main"]

[tool.setuptools.packages.find]
include = ["src*"]
