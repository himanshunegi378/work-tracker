name: Build Desktop Bundles

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Ubuntu
            os: ubuntu-latest
            artifact_name: worktracker-ubuntu
            archive_name: worktracker-ubuntu.tar.gz
            test_shell: bash
            test_command: |
              python -m venv .venv
              .venv/bin/python -m pip install -r requirements.txt pyinstaller
              QT_QPA_PLATFORM=offscreen .venv/bin/python -m unittest discover -s tests
            build_shell: bash
            build_command: bash scripts/build_linux.sh
            archive_shell: bash
            archive_command: tar -czf worktracker-ubuntu.tar.gz -C dist WorkTracker

          - label: Windows
            os: windows-latest
            artifact_name: worktracker-windows
            archive_name: worktracker-windows.zip
            test_shell: pwsh
            test_command: |
              python -m venv .venv
              .\.venv\Scripts\python.exe -m pip install -r requirements.txt pyinstaller
              .\.venv\Scripts\python.exe -m unittest discover -s tests
            build_shell: pwsh
            build_command: powershell -ExecutionPolicy Bypass -File scripts/build_windows.ps1
            archive_shell: pwsh
            archive_command: Compress-Archive -Path dist\WorkTracker -DestinationPath worktracker-windows.zip -Force

          - label: macOS
            os: macos-latest
            artifact_name: worktracker-macos
            archive_name: worktracker-macos.zip
            test_shell: bash
            test_command: |
              python -m venv .venv
              .venv/bin/python -m pip install -r requirements.txt pyinstaller
              QT_QPA_PLATFORM=offscreen .venv/bin/python -m unittest discover -s tests
            build_shell: bash
            build_command: bash scripts/build_macos.sh
            archive_shell: bash
            archive_command: ditto -c -k --sequesterRsrc --keepParent dist/WorkTracker worktracker-macos.zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Run test suite
        shell: ${{ matrix.test_shell }}
        run: ${{ matrix.test_command }}

      - name: Build desktop bundle
        shell: ${{ matrix.build_shell }}
        run: ${{ matrix.build_command }}

      - name: Archive bundle
        shell: ${{ matrix.archive_shell }}
        run: ${{ matrix.archive_command }}

      - name: Upload build artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.archive_name }}
          if-no-files-found: error
          retention-days: 14
