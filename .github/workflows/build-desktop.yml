name: Build Desktop Bundles

on:
  push:
    branches:
      - main

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.actor != 'github-actions[bot]' }}
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Ubuntu
            os: ubuntu-22.04   # old on purpose: the bundle needs at least the glibc of the machine that builds it
            artifact_name: worktracker-ubuntu

          - label: Windows
            os: windows-latest
            artifact_name: worktracker-windows
            archive_name: worktracker-windows.zip

          - label: macOS
            os: macos-latest
            artifact_name: worktracker-macos
            archive_name: worktracker-macos.zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Linux Qt runtime dependencies
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libopengl0 \
            libdbus-1-3 \
            libxkbcommon-x11-0

      - name: Set up Python environment on Linux and macOS
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt pytest pyinstaller

      - name: Set up Python environment on Windows
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt pytest pyinstaller

      - name: Verify PySide6 Qt import on Linux
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          QT_QPA_PLATFORM=offscreen QT_OPENGL=software LIBGL_ALWAYS_SOFTWARE=1 \
            .venv/bin/python -c "from PySide6.QtWidgets import QApplication; print('PySide6 import OK')"

      - name: Run test suite on Linux
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          QT_QPA_PLATFORM=offscreen QT_OPENGL=software LIBGL_ALWAYS_SOFTWARE=1 \
            .venv/bin/python -m pytest tests -q

      - name: Run test suite on macOS
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          QT_QPA_PLATFORM=offscreen .venv/bin/python -m pytest tests -q

      - name: Run test suite on Windows
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m pytest tests -q

      - name: Build desktop bundle on Ubuntu
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: bash scripts/build_linux.sh

      - name: Build desktop bundle on Windows
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/build_windows.ps1

      - name: Build desktop bundle on macOS
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: bash scripts/build_macos.sh

      - name: Build .deb package on Ubuntu
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          MAX_GLIBC=2.35 bash scripts/build_deb.sh .
          mv work-tracker_*.deb worktracker-ubuntu.deb

      - name: Archive Windows bundle
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: Compress-Archive -Path dist\WorkTracker -DestinationPath worktracker-windows.zip -Force

      - name: Archive macOS bundle
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: ditto -c -k --sequesterRsrc --keepParent dist/WorkTracker.app worktracker-macos.zip

      - name: Upload .deb package
        if: ${{ success() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@v4
        with:
          name: worktracker-deb
          path: worktracker-ubuntu.deb
          if-no-files-found: error
          retention-days: 14

      - name: Upload build artifact
        if: ${{ success() && runner.os != 'Linux' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.archive_name }}
          if-no-files-found: error
          retention-days: 14

  publish-artifacts:
    if: ${{ github.actor != 'github-actions[bot]' }}
    name: Publish Latest Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download .deb artifact
        uses: actions/download-artifact@v4
        with:
          name: worktracker-deb
          path: tmp-artifacts

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: worktracker-windows
          path: tmp-artifacts

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: worktracker-macos
          path: tmp-artifacts

      # Binaries live in a rolling "latest" GitHub Release, not in git history,
      # so cloning the repo stays small.
      - name: Publish to the rolling "latest" release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="Latest successful desktop build from \`main\` (${GITHUB_SHA::7}). Unsigned. Replaced on every push to \`main\`."
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --notes "$notes" --target "$GITHUB_SHA"
          else
            gh release create latest --title "Latest desktop build" --notes "$notes" --target "$GITHUB_SHA"
          fi
          gh release upload latest --clobber tmp-artifacts/*
