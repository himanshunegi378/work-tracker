name: Build Desktop Bundles

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Ubuntu
            os: ubuntu-latest
            artifact_name: worktracker-ubuntu
            archive_name: worktracker-ubuntu.tar.gz

          - label: Windows
            os: windows-latest
            artifact_name: worktracker-windows
            archive_name: worktracker-windows.zip

          - label: macOS
            os: macos-latest
            artifact_name: worktracker-macos
            archive_name: worktracker-macos.zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Linux Qt runtime dependencies
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libopengl0 \
            libdbus-1-3 \
            libxkbcommon-x11-0

      - name: Set up Python environment on Linux and macOS
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt pyinstaller

      - name: Set up Python environment on Windows
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt pyinstaller

      - name: Verify PySide6 Qt import on Linux
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          QT_QPA_PLATFORM=offscreen QT_OPENGL=software LIBGL_ALWAYS_SOFTWARE=1 \
            .venv/bin/python -c "from PySide6.QtWidgets import QApplication; print('PySide6 import OK')"

      - name: Run test suite on Linux
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          QT_QPA_PLATFORM=offscreen QT_OPENGL=software LIBGL_ALWAYS_SOFTWARE=1 \
            .venv/bin/python -m unittest discover -s tests

      - name: Run test suite on macOS
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          QT_QPA_PLATFORM=offscreen .venv/bin/python -m unittest discover -s tests

      - name: Run test suite on Windows
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m unittest discover -s tests

      - name: Build desktop bundle on Ubuntu
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: bash scripts/build_linux.sh

      - name: Build desktop bundle on Windows
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/build_windows.ps1

      - name: Build desktop bundle on macOS
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: bash scripts/build_macos.sh

      - name: Archive Ubuntu bundle
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: tar -czf worktracker-ubuntu.tar.gz -C dist WorkTracker

      - name: Archive Windows bundle
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: Compress-Archive -Path dist\WorkTracker -DestinationPath worktracker-windows.zip -Force

      - name: Archive macOS bundle
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: ditto -c -k --sequesterRsrc --keepParent dist/WorkTracker worktracker-macos.zip

      - name: Upload build artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.archive_name }}
          if-no-files-found: error
          retention-days: 14
