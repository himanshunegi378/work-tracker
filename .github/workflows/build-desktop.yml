name: Build Desktop Bundles

on:
  push:
    branches:
      - main
    paths-ignore:
      - artifacts/desktop/**

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.actor != 'github-actions[bot]' }}
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Ubuntu
            os: ubuntu-latest
            artifact_name: worktracker-ubuntu
            archive_name: worktracker-ubuntu.tar.gz

          - label: Windows
            os: windows-latest
            artifact_name: worktracker-windows
            archive_name: worktracker-windows.zip

          - label: macOS
            os: macos-latest
            artifact_name: worktracker-macos
            archive_name: worktracker-macos.zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Linux Qt runtime dependencies
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libopengl0 \
            libdbus-1-3 \
            libxkbcommon-x11-0

      - name: Set up Python environment on Linux and macOS
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt pyinstaller

      - name: Set up Python environment on Windows
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt pyinstaller

      - name: Verify PySide6 Qt import on Linux
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          QT_QPA_PLATFORM=offscreen QT_OPENGL=software LIBGL_ALWAYS_SOFTWARE=1 \
            .venv/bin/python -c "from PySide6.QtWidgets import QApplication; print('PySide6 import OK')"

      - name: Run test suite on Linux
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          QT_QPA_PLATFORM=offscreen QT_OPENGL=software LIBGL_ALWAYS_SOFTWARE=1 \
            .venv/bin/python -m unittest discover -s tests

      - name: Run test suite on macOS
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          QT_QPA_PLATFORM=offscreen .venv/bin/python -m unittest discover -s tests

      - name: Run test suite on Windows
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m unittest discover -s tests

      - name: Build desktop bundle on Ubuntu
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: bash scripts/build_linux.sh

      - name: Build desktop bundle on Windows
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/build_windows.ps1

      - name: Build desktop bundle on macOS
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: bash scripts/build_macos.sh

      - name: Archive Ubuntu bundle
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: tar -czf worktracker-ubuntu.tar.gz -C dist WorkTracker

      - name: Archive Windows bundle
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: Compress-Archive -Path dist\WorkTracker -DestinationPath worktracker-windows.zip -Force

      - name: Archive macOS bundle
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: ditto -c -k --sequesterRsrc --keepParent dist/WorkTracker.app worktracker-macos.zip

      - name: Upload build artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.archive_name }}
          if-no-files-found: error
          retention-days: 14

  publish-artifacts:
    if: ${{ github.actor != 'github-actions[bot]' }}
    name: Publish Latest Artifacts
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare artifacts branch
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin artifacts; then
            git fetch origin artifacts
            git switch --force-create artifacts --track origin/artifacts
          else
            git switch --orphan artifacts
            git rm -rf . >/dev/null 2>&1 || true
            git clean -fdx
          fi

      - name: Download Ubuntu artifact
        uses: actions/download-artifact@v4
        with:
          name: worktracker-ubuntu
          path: tmp-artifacts/ubuntu

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: worktracker-windows
          path: tmp-artifacts/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: worktracker-macos
          path: tmp-artifacts/macos

      - name: Update tracked artifact folder
        shell: bash
        run: |
          mkdir -p artifacts/desktop
          rm -f artifacts/desktop/worktracker-ubuntu.tar.gz
          rm -f artifacts/desktop/worktracker-windows.zip
          rm -f artifacts/desktop/worktracker-macos.zip
          cp tmp-artifacts/ubuntu/worktracker-ubuntu.tar.gz artifacts/desktop/worktracker-ubuntu.tar.gz
          cp tmp-artifacts/windows/worktracker-windows.zip artifacts/desktop/worktracker-windows.zip
          cp tmp-artifacts/macos/worktracker-macos.zip artifacts/desktop/worktracker-macos.zip
          cat <<'EOF' > artifacts/desktop/README.md
          # Desktop Downloads

          This folder contains the latest successful desktop build archives published from the `main` branch CI workflow onto the `artifacts` branch.

          ## Files
          - `worktracker-ubuntu.tar.gz`: Latest Ubuntu desktop bundle
          - `worktracker-windows.zip`: Latest Windows desktop bundle
          - `worktracker-macos.zip`: Latest macOS app bundle archive

          ## Notes
          - These files are replaced on each successful push to `main`.
          - GitHub Actions run artifacts are still available from the workflow run summary page.
          - macOS builds are unsigned in this setup.
          EOF

      - name: Commit published artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/desktop

          if git diff --cached --quiet; then
            echo "No artifact changes to commit."
            exit 0
          fi

          git commit -m "chore: publish latest desktop artifacts [skip ci]"
          git push origin artifacts
